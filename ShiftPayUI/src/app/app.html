<div [class.dark]="isDarkMode" class="min-h-screen font-sans transition-colors duration-300">
  <!-- Auth Layout -->
  <ng-container *ngIf="isAuthRoute">
    <router-outlet></router-outlet>
  </ng-container>

  <!-- Main App Layout -->
  <div *ngIf="!isAuthRoute" class="flex min-h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">

    <!-- Sidebar -->
    <app-sidebar [isOpen]="isSidebarOpen" (closeSidebar)="toggleSidebar()"></app-sidebar>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto">

      <!-- Top Header -->
      <app-header class="sticky top-0 z-40" [isDarkMode]="isDarkMode" (toggleSidebar)="toggleSidebar()"
        (toggleTheme)="toggleTheme()">
      </app-header>

      <!-- Content Outlet -->
      <div class="flex-1 p-8">
        <router-outlet></router-outlet>
      </div>

    </div>
  </div>
</div>
